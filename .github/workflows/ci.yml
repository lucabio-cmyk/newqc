# Root CI for the QConnect-AI monorepo.
#
# GitHub Actions only runs workflows from the repository-root .github/workflows,
# so THIS is the workflow that actually executes. The per-project workflow files
# under qconnect-ai-cloud/.github/workflows document the intended per-repo CI for
# if/when the projects are split into standalone repositories with
# `git subtree split`.
name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Shared library is the wire contract — install it first (editable).
          pip install -e qconnect-ai-shared
          pip install -r qconnect-ai-cloud/requirements.txt
          pip install -r qconnect-ai-edge/requirements.txt
          pip install pytest

      - name: Test shared
        run: pytest qconnect-ai-shared/tests -q

      - name: Test edge
        run: pytest qconnect-ai-edge/tests -q

      - name: Test cloud
        # Run separately from the others: all three suites use a `tests`
        # package, which collides in a single pytest invocation.
        run: pytest qconnect-ai-cloud/cloud/tests -q

      - name: Test integration
        # Cross-project edge<->cloud integration tests. Kept as a separate
        # invocation for clearer CI output (the `integration_tests` package
        # name does not collide with the per-project `tests` packages).
        run: pytest integration_tests -q

      - name: Test microservices
        # Each service is a separate invocation: their main.py modules use
        # top-level imports (schemas/models/main) that would collide in a
        # single pytest session.
        run: |
          pytest qconnect-ai-cloud/cloud/services/ml_inference/tests -q
          pytest qconnect-ai-cloud/cloud/services/federated_learning/tests -q
          pytest qconnect-ai-cloud/cloud/services/rca_capa/tests -q

      - name: Test load harness
        run: pytest tools/loadtest -q

  lint:
    name: lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install linters
        run: pip install black ruff
      - name: black --check
        run: black -l 100 --check qconnect-ai-shared qconnect-ai-edge qconnect-ai-cloud integration_tests tools
      - name: ruff check
        run: ruff check qconnect-ai-shared qconnect-ai-edge qconnect-ai-cloud integration_tests tools

  db-schema:
    name: postgres schema applies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qconnect_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Apply init.sql
        # pgcrypto ships with postgres:16; timescaledb/vector extensions are not
        # present in the stock image, so allow those CREATE EXTENSION lines to be
        # non-fatal while still validating the rest of the schema.
        run: |
          PGPASSWORD=test psql -h localhost -U test -d qconnect_test \
            -v ON_ERROR_STOP=0 \
            -f qconnect-ai-cloud/cloud/databases/postgres/init.sql

  migrations:
    name: alembic migrations (offline)
    runs-on: ubuntu-latest
    # Offline check: validates the revision chain and that every migration emits
    # SQL. A live `alembic upgrade` is intentionally not run here because the
    # baseline executes init.sql, which requires the timescaledb/vector
    # extensions absent from the stock postgres image.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Alembic
        run: pip install "alembic>=1.13" "sqlalchemy>=2" "psycopg[binary]>=3.1"
      - name: Verify revision history
        working-directory: qconnect-ai-cloud
        run: alembic history --verbose
      - name: Generate upgrade SQL (offline)
        working-directory: qconnect-ai-cloud
        run: alembic upgrade head --sql
