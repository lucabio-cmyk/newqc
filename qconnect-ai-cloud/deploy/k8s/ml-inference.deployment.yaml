# =====================================================================
# QConnect-AI Cloud :: ml-inference Deployment
# ---------------------------------------------------------------------
# AI enrichment service (failure prediction, anomaly detection) on
# container port 8001. Single replica baseline; the HPA scales it out.
# Image tag overridden via kustomize `images:` block.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference
  labels:
    app.kubernetes.io/name: ml-inference
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-inference
        app.kubernetes.io/component: inference
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml-inference
          image: registry.example.com/qconnect-ai/ml-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: qconnect-ai-config
            - secretRef:
                name: qconnect-ai-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
