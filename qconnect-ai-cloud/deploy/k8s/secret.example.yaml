# =====================================================================
# QConnect-AI Cloud :: Secret TEMPLATE (EXAMPLE ONLY)
# ---------------------------------------------------------------------
# DO NOT commit real secrets; use a sealed-secrets/ESO/Vault flow.
#
# This file is a TEMPLATE. It is intentionally EXCLUDED from
# kustomization.yaml so `kubectl apply -k` never ships placeholders.
#
# To deploy, generate a real Secret named `qconnect-ai-secrets` out of
# band, for example:
#   - Sealed Secrets (bitnami): kubeseal < real-secret.yaml > sealed.yaml
#   - External Secrets Operator (ESO): ExternalSecret -> AWS/GCP/Vault
#   - HashiCorp Vault Agent / CSI injector
#
# The keys below MUST match the names consumed by the application.
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: qconnect-ai-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://USER:PLACEHOLDER@db-host:5432/qconnect"
  TIMESCALE_URL: "postgresql+asyncpg://USER:PLACEHOLDER@ts-host:5432/qconnect_ts"
  REDIS_URL: "redis://redis-host:6379/0"
  NEO4J_URI: "bolt://neo4j-host:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "PLACEHOLDER-neo4j-password"
  RABBITMQ_URL: "amqp://USER:PLACEHOLDER@rabbitmq-host:5672//"
  JWT_SECRET: "PLACEHOLDER-generate-with-openssl-rand-hex-32"
