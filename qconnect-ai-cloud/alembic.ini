# Alembic configuration for the QConnect-AI cloud database.
#
# The database URL is resolved at runtime in env.py from the DATABASE_URL /
# ALEMBIC_DATABASE_URL environment variable (falling back to the value below),
# so secrets never live in this file. Any `postgresql+asyncpg://` URL is
# normalised to a sync driver for Alembic.
[alembic]
script_location = cloud/databases/alembic
prepend_sys_path = .
# Use a path-friendly, sortable revision id for new migrations.
# (timestamped slugs keep `versions/` readable)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Overridden by env.py; kept as a harmless default for tooling that reads it.
sqlalchemy.url = postgresql+psycopg://qconnect:qconnect@localhost:5432/qconnect

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
