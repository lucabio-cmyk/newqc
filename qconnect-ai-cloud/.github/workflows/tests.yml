name: Tests

# Unit-test matrix across Python 3.11 and 3.12. These run the pure engine tests
# and the API test (which degrades offline), without external services.

on:
  push:
    branches: [main, master, develop]
  pull_request:

defaults:
  run:
    working-directory: qconnect-ai-cloud

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest cloud/tests/ -q
