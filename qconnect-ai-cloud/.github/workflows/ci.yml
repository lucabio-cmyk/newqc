name: CI

# Full CI: lint -> unit tests (with Postgres) -> docker compose build.
# The cloud project lives at qconnect-ai-cloud/ in the monorepo, so every step
# sets that as the working directory.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: qconnect-ai-cloud

jobs:
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install black>=24.0 ruff>=0.3
      - name: black --check
        run: black --check .
      - name: ruff
        run: ruff check .

  # ------------------------------------------------------------------ #
  tests:
    name: Unit tests (py3.12 + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qconnect
          POSTGRES_PASSWORD: qconnect
          POSTGRES_DB: qconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qconnect -d qconnect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://qconnect:qconnect@localhost:5432/qconnect
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: qconnect
      PGPASSWORD: qconnect
      PGDATABASE: qconnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Initialize database schema
        run: |
          # pgcrypto ships with the postgres image; timescaledb/vector lines in
          # init.sql may warn on the vanilla image — tolerate by not stopping.
          psql "postgresql://qconnect:qconnect@localhost:5432/qconnect" \
            -f cloud/databases/postgres/init.sql || true
      - name: Run qc_evaluation service tests (if present)
        run: |
          if [ -d cloud/services/qc_evaluation/tests ]; then
            pytest cloud/services/qc_evaluation/tests/
          else
            echo "No service-local tests directory; skipping."
          fi
      - name: Run cloud tests
        run: pytest cloud/tests/

  # ------------------------------------------------------------------ #
  build-docker:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: docker compose build
