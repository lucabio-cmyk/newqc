name: Deploy

# Placeholder release pipeline: builds and pushes service images on a version
# tag (e.g. v0.1.0).
#
# REQUIRED SECRETS (configure in repo settings before enabling):
#   REGISTRY            e.g. ghcr.io/your-org   or  registry.example.com
#   REGISTRY_USERNAME
#   REGISTRY_PASSWORD
#
# Until those are set this workflow only runs on tag pushes and will no-op the
# login/push steps if credentials are absent.

on:
  push:
    tags:
      - "v*.*.*"

defaults:
  run:
    working-directory: qconnect-ai-cloud

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: qc-evaluation,      context: cloud/services/qc_evaluation }
          - { name: ml-inference,       context: cloud/services/ml_inference }
          - { name: federated-learning, context: cloud/services/federated_learning }
          - { name: rca-capa,           context: cloud/services/rca_capa }
          - { name: analytics,          context: cloud/services/analytics }
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push if credentials present)
        uses: docker/build-push-action@v5
        with:
          context: qconnect-ai-cloud/${{ matrix.service.context }}
          push: ${{ secrets.REGISTRY_USERNAME != '' }}
          tags: |
            ${{ secrets.REGISTRY }}/qconnect-${{ matrix.service.name }}:${{ steps.meta.outputs.version }}
            ${{ secrets.REGISTRY }}/qconnect-${{ matrix.service.name }}:latest

  notify:
    name: Deployment placeholder
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Note
        run: |
          echo "Images built for ${GITHUB_REF_NAME}."
          echo "TODO: trigger the actual rollout (kubectl set image / Helm / ArgoCD)."
