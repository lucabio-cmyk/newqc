# =============================================================================
# QConnect-AI :: Grafana dashboard provider
# Loads JSON dashboards from /var/lib/grafana/dashboards (mounted in compose).
# =============================================================================
apiVersion: 1

providers:
  - name: qconnect-dashboards
    orgId: 1
    folder: QConnect-AI
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
