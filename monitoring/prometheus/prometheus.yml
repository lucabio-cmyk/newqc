# =============================================================================
# QConnect-AI :: Prometheus configuration
# -----------------------------------------------------------------------------
# Scrapes the cloud + edge FastAPI services (both expose /metrics) and itself.
# The cloud/edge targets resolve via the shared external Docker network — see
# monitoring/docker-compose.monitoring.yml for how to join the networks.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: qconnect-ai

# --- Alerting rules ---------------------------------------------------------- #
rule_files:
  - /etc/prometheus/alerts/rules.yml

# --- Alertmanager (commented: enable once an Alertmanager is deployed) ------- #
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# --- Scrape jobs ------------------------------------------------------------- #
scrape_configs:
  - job_name: qconnect-cloud
    metrics_path: /metrics
    static_configs:
      - targets: ["qc-evaluation:8000"]
        labels:
          service: qc-evaluation
          tier: cloud

  - job_name: qconnect-edge
    metrics_path: /metrics
    static_configs:
      - targets: ["qc-inference:8000"]
        labels:
          service: qc-inference
          tier: edge

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- node-exporter (host metrics). Uncomment when node-exporter is running.
  # - job_name: node-exporter
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
